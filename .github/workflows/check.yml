name: Verify offline studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check reviewed file inventory and privacy
        run: |
          node tools/audit-release.mjs . --public
          node tools/audit-privacy.mjs .
      - name: Run offline application tests
        run: node --test --test-isolation=none test/*.test.mjs
