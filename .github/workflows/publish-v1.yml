name: Publish verified offline v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Lshyb/lightfield-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve and verify the reviewed distribution files
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request, zipfile
          files = [
              ('lightfield-studio-v1.0.0-windows-x64.zip', 'bd0948f31970c2a023f1ffa31fdd3fb9b84a6043', 'a015745d944dbb24a4ebc93fd8e86386775b04727cd70f04a9c7bf9d8e2940a0'),
              ('lightfield-studio-v1.0.0-source.zip', 'a715d81e63f39fb1132cfb98de4e8295cf51d4e9', 'c6be77f562c5003c88fc6602b5f382140db9a31332f3f7203bd65c7306dd0622'),
          ]
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lightfield-release'
          target.mkdir(exist_ok=True)
          for name, blob_sha, expected in files:
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GH_REPO'] + '/git/blobs/' + blob_sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'LIGHTFIELD-release'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  blob = json.load(response)
              assert blob['encoding'] == 'base64'
              data = base64.b64decode(blob['content'])
              assert hashlib.sha256(data).hexdigest() == expected, 'Archive digest mismatch'
              (target / name).write_bytes(data)
          sums = ''.join(expected + '  ' + name + '\n' for name, _, expected in files)
          (target / 'SHA256SUMS.txt').write_text(sums, encoding='utf-8')
          if not pathlib.Path('package.json').exists():
              with zipfile.ZipFile(target / files[1][0]) as archive:
                  assert archive.testzip() is None
                  for info in archive.infolist():
                      path = pathlib.PurePosixPath(info.filename)
                      assert path.parts[0] == 'lightfield-studio' and '..' not in path.parts
                      relative = pathlib.Path(*path.parts[1:])
                      assert relative.parts and relative.parts[0] not in ('.git', '.github', 'runtime')
                      destination = pathlib.Path.cwd() / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.read(info))
              print('Verified source files imported.')
          else:
              print('Existing source files preserved.')
          print('Both distribution archives verified.')
          PY

      - name: Check the application and local server
        run: |
          node --check dist/app.js
          node --test

      - name: Save source with a privacy-preserving identity
        run: |
          git config user.name 'LIGHTFIELD contributors'
          git config user.email '116474006+Lshyb@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Add offline studio source and detailed beginner guide'
            git push origin HEAD:main
          fi

      - name: Publish the complete offline release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.error, urllib.parse, urllib.request
          repo = os.environ['GH_REPO']
          base = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def api(url, method='GET', data=None, content_type='application/json'):
              payload = data if isinstance(data, bytes) else None if data is None else json.dumps(data, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(url, data=payload, method=method, headers={
                  'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                  'Content-Type': content_type, 'User-Agent': 'LIGHTFIELD-release'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)
          notes = pathlib.Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          guide = 'https://github.com/' + repo + '/blob/main/docs/USER_GUIDE.zh-CN.md'
          notes += '\n\n## 新手从这里开始\n\n1. 在下方 Assets 下载名称含 windows-x64 的 ZIP。\n2. 右键「全部解压」，保留完整文件夹。\n3. 双击 Lightfield.exe，浏览器会打开摄影棚。\n4. 保留启动器窗口，关闭窗口会停止服务。\n\n[详细新手使用指南](' + guide + ')：下载、启动、伦勃朗光练习、拍照、保存方案和常见问题。\n'
          try:
              release = api(base + '/releases/tags/v1.0.0')
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api(base + '/releases', 'POST', {
                  'tag_name': 'v1.0.0', 'target_commitish': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                  'name': '光场 LIGHTFIELD v1.0.0 · Windows 离线版', 'body': notes, 'draft': True, 'prerelease': False})
          existing = {asset['name']: asset for asset in release['assets']}
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lightfield-release'
          for name in ['lightfield-studio-v1.0.0-windows-x64.zip', 'lightfield-studio-v1.0.0-source.zip', 'SHA256SUMS.txt']:
              data = (directory / name).read_bytes()
              expected = 'sha256:' + hashlib.sha256(data).hexdigest()
              if name in existing:
                  assert existing[name].get('digest') == expected, 'Existing asset differs; refusing replacement'
                  continue
              url = release['upload_url'].split('{', 1)[0] + '?name=' + urllib.parse.quote(name)
              asset = api(url, 'POST', data, 'application/zip' if name.endswith('.zip') else 'text/plain')
              assert asset['size'] == len(data)
              if asset.get('digest'): assert asset['digest'] == expected
          if release['draft']:
              release = api(base + '/releases/' + str(release['id']), 'PATCH', {'draft':False, 'body':notes, 'make_latest':'true'})
          print('Published: ' + release['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Offline release ready\n\n[Download the Windows offline ZIP](' + release['html_url'] + ')\n\n[Detailed beginner guide](' + guide + ')\n')
          PY
